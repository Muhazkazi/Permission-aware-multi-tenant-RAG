[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "permission-aware-multi-tenant-rag"
version = "0.1.0"
description = "A secure, permission-aware multi-tenant RAG API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "pypdf>=7.1.1,<8",
    "pydantic-settings>=2.6,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "PyMySQL>=1.1,<2.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
